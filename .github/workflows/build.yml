
name: Frontend Build and Kubernetes Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      # 1. Checkout frontend source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build frontend application
      - name: Build frontend
        run: npm run build

      # 5. Log in to Docker Hub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/bookstore-frontend:v1 .

      # 7. Push Docker image
      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/bookstore-frontend:v1

      # 8. Check Kubernetes connectivity
      - name: Diagnose Kubernetes API Connectivity
        run: |
          echo "Checking Kubernetes API port..."
          nc -vz -w 5 172.31.30.220 6443

          echo "Checking Kubernetes API readiness..."
          curl -k --connect-timeout 5 \
            https://172.31.30.220:6443/readyz

      # 9. Configure Kubernetes
      - name: Configure Kubernetes
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          echo "Validating Kubernetes configuration..."
          kubectl config current-context

          echo "Checking Kubernetes cluster access..."
          kubectl get nodes

          echo "Deploying application..."
          kubectl apply -f deployment.yml
          kubectl apply -f service.yml
