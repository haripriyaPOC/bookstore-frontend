apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-frontend
  labels:
    app: fronted-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fronted-app
  template:
    metadata:
      labels:
        app: fronted-app
    spec:
      containers:
        - name: my-app-container
          image: haripriya1310/bookstore-frontend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5173
